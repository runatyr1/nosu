name: nosu

x-app-build: &app-build
  context: ..
  dockerfile: Dockerfile
  args:
    NEXT_PUBLIC_APP_URL: ${NOSU_PUBLIC_URL:?set NOSU_PUBLIC_URL in infra/.env}
    NEXT_PUBLIC_GROUPS_APP_URL: /groups-app/
    NEXT_PUBLIC_LOCAL_RELAY_ONLY: ${NEXT_PUBLIC_LOCAL_RELAY_ONLY:-false}

x-log-options: &log-options
  syslog-address: udp://127.0.0.1:5514
  syslog-format: rfc5424

services:
  postgres:
    image: postgres:16-alpine
    logging:
      driver: syslog
      options:
        <<: *log-options
        tag: postgres
    environment:
      POSTGRES_USER: nostrich
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}
      POSTGRES_DB: nostrich
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U nostrich -d nostrich']
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  migrate:
    image: nosu-app:local
    build: *app-build
    command: [pnpm, --filter, '@nostrich/api', 'db:deploy']
    environment:
      DATABASE_URL: ${NOSU_DATABASE_URL:?set NOSU_DATABASE_URL in infra/.env}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  nosu:
    image: nosu-app:local
    logging:
      driver: syslog
      options:
        <<: *log-options
        tag: nosu
    build: *app-build
    environment:
      DATABASE_URL: ${NOSU_DATABASE_URL:?set NOSU_DATABASE_URL in infra/.env}
      NEXT_PUBLIC_APP_URL: ${NOSU_PUBLIC_URL:?set NOSU_PUBLIC_URL in infra/.env}
      NEXT_PUBLIC_GROUPS_APP_URL: /groups-app/
      PFP_CACHE_DIR: /data/pfp
      UNFURL_PROXY_SECRET: ${UNFURL_PROXY_SECRET:?set UNFURL_PROXY_SECRET in infra/.env}
    volumes:
      - pfp-cache:/data/pfp
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3400/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5
    restart: unless-stopped

  trending:
    image: nosu-app:local
    logging:
      driver: syslog
      options:
        <<: *log-options
        tag: trending
    command: [pnpm, --filter, '@nostrich/api', trending]
    environment:
      DATABASE_URL: ${NOSU_DATABASE_URL:?set NOSU_DATABASE_URL in infra/.env}
      TRENDING_INDEX_URL: ${TRENDING_INDEX_URL:-https://api.nostr.wine/trending}
      TRENDING_ENABLED: 'true'
      TRENDING_BUILD_TIMEOUT_MS: ${TRENDING_BUILD_TIMEOUT_MS:-600000}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  opensearch:
    image: opensearchproject/opensearch:2.19.0
    logging:
      driver: syslog
      options:
        <<: *log-options
        tag: opensearch
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: 'true'
      DISABLE_INSTALL_DEMO_CONFIG: 'true'
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
      node.store.allow_mmap: 'false'
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 30
    restart: unless-stopped

  ditto-relay:
    image: nosu-ditto-relay:local
    build:
      context: ../apps/ditto-relay
    logging:
      driver: syslog
      options:
        <<: *log-options
        tag: ditto-relay
    environment:
      PORT: '13131'
      RELAY_URL: ${DITTO_RELAY_URL:-ws://localhost/relay}
      PUBLIC_URL: ${NOSU_PUBLIC_URL:?set NOSU_PUBLIC_URL in infra/.env}/relay
      NOSTR_SECRET_KEY: ${DITTO_NSEC:-}
      OPENSEARCH_NODE: http://opensearch:9200
      PROTOCOL_WORKERS: '1'
    ports:
      - '127.0.0.1:13131:13131'
    depends_on:
      opensearch:
        condition: service_healthy
    restart: unless-stopped

  ditto-sync:
    image: nosu-ditto-relay:local
    command: [bun, scripts/sync.ts]
    logging:
      driver: syslog
      options:
        <<: *log-options
        tag: ditto-sync
    environment:
      PORT: '13132'
      SYNC_CONFIG: /config/sync.json
      SYNC_STATE_DIR: /data
      SYNC_PUBLIC_URL: ${NOSU_PUBLIC_URL:?set NOSU_PUBLIC_URL in infra/.env}/relay-sync/session
      SYNC_CLIENT_ORIGIN: ${NOSU_PUBLIC_URL:?set NOSU_PUBLIC_URL in infra/.env}
      RELAY_URL: ${DITTO_RELAY_URL:-ws://localhost/relay}
      NOSTR_SECRET_KEY: ${DITTO_NSEC:-}
      OPENSEARCH_NODE: http://opensearch:9200
      STATS_ENABLED: 'false'
    volumes:
      - ./ditto-sync.json:/config/sync.json:ro
      - sync-data:/data
    depends_on:
      ditto-relay:
        condition: service_healthy
    restart: unless-stopped

  groups:
    image: nosu-groups:local
    logging:
      driver: syslog
      options:
        <<: *log-options
        tag: groups
    build:
      context: ..
      dockerfile: infra/groups.Dockerfile
      args:
        VITE_BASE_PATH: /groups-app/
        VITE_PUBLIC_WEB_ORIGIN: ${NOSU_PUBLIC_URL:?set NOSU_PUBLIC_URL in infra/.env}/groups
        VITE_NOSU_PARENT_ORIGIN: ${NOSU_PUBLIC_URL:?set NOSU_PUBLIC_URL in infra/.env}
        VITE_CONCORD_AV_SERVERS: ${VITE_CONCORD_AV_SERVERS:-}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1/healthz']
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ingress:
    image: caddy:2-alpine
    logging:
      driver: syslog
      options:
        <<: *log-options
        tag: ingress
    environment:
      NOSU_SITE_ADDRESS: ${NOSU_SITE_ADDRESS:-:80}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${NOSU_TLS_ROUTES:-./tls-public.caddy}:/etc/caddy/tls-routes.caddy:ro
      - ${NOSU_DASHBOARD_ROUTES:-./dashboard-local.caddy}:/etc/caddy/dashboard-routes.caddy:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      nosu:
        condition: service_healthy
      groups:
        condition: service_healthy
      controller:
        condition: service_healthy
    restart: unless-stopped

  controller:
    image: nosu-controller:local
    build:
      context: ..
      dockerfile: infra/controller/Dockerfile
    environment:
      CONTROLLER_ORIGIN: ${NOSU_PUBLIC_URL:?set NOSU_PUBLIC_URL in infra/.env}
      CONTROLLER_PIN: ${CONTROLLER_PIN:-}
      PUBLIC_DASHBOARD: ${PUBLIC_DASHBOARD:-false}
    ports:
      - '127.0.0.1:3401:3401'
      - '127.0.0.1:5514:5514/udp'
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3401/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
  pfp-cache:
  caddy-data:
  caddy-config:
  opensearch-data:
  sync-data:

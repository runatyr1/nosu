map $uri $nosu_groups_cache {
    ~^/groups-app/assets/ "public, max-age=31536000, immutable";
    default "no-cache";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header Cache-Control $nosu_groups_cache always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://www.youtube.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' https: data:; connect-src 'self' wss: https: blob:; media-src 'self' blob: https:; worker-src 'self' blob:; frame-src 'self' https://www.youtube-nocookie.com https://open.spotify.com https://platform.twitter.com https://www.instagram.com https://streamable.com https://*.iframe.diy; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location ^~ /groups-app/assets/ {
        rewrite ^/groups-app/(.*)$ /$1 break;
        try_files $uri =404;
    }

    location ^~ /groups-app/ {
        rewrite ^/groups-app/(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /index.html {
        internal;
        try_files $uri =404;
    }

    location / { return 404; }
}
